name: Build Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: bash ./gradlew --no-daemon :fermata:assembleMobileDebug :fermata:assembleAutoDebug

      - uses: actions/upload-artifact@v4
        with:
          name: luka-debug-apks
          path: |
            fermata/build/outputs/apk/mobile/debug/*.apk
            fermata/build/outputs/apk/auto/debug/*.apk
          if-no-files-found: error
          retention-days: 14
