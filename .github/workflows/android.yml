name: Build Android APKs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          LUKA_KEYSTORE_BASE64: ${{ secrets.LUKA_KEYSTORE_BASE64 }}
          LUKA_KEYSTORE_PASSWORD: ${{ secrets.LUKA_KEYSTORE_PASSWORD }}
          LUKA_KEY_ALIAS: ${{ secrets.LUKA_KEY_ALIAS }}
          LUKA_KEY_PASSWORD: ${{ secrets.LUKA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$LUKA_KEYSTORE_BASE64" ] || [ -z "$LUKA_KEYSTORE_PASSWORD" ] || \
             [ -z "$LUKA_KEY_ALIAS" ] || [ -z "$LUKA_KEY_PASSWORD" ]; then
            echo "::error::Configure the four LUKA_KEYSTORE_* GitHub Actions secrets before building releases."
            exit 1
          fi
          printf '%s' "$LUKA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/luka-release.jks"
          test -s "$RUNNER_TEMP/luka-release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/luka-release.jks"
            printf 'storePassword=%s\n' "$LUKA_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$LUKA_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$LUKA_KEY_PASSWORD"
          } > local.properties

      - name: Build release APKs
        run: bash ./gradlew --no-daemon :fermata:assembleMobileRelease :fermata:assembleAutoRelease

      - uses: actions/upload-artifact@v4
        with:
          name: luka-release-apks
          path: |
            fermata/build/outputs/apk/mobile/release/*.apk
            fermata/build/outputs/apk/auto/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            fermata/build/outputs/apk/mobile/release/*.apk \
            fermata/build/outputs/apk/auto/release/*.apk \
            --title "Luka $RELEASE_TAG" \
            --generate-notes
